publiccodeYmlVersion: "0"

name: invent
url: "https://github.com/SUNET/invent"
platforms:
  - linux

categories:
  - it-service-management

developmentStatus: development

softwareType: "standalone/other"

description:
  en:
    shortDescription: >
      Invent is a inventory and scanning tool.

    longDescription: >
      Invent scans Docker images and servers and has the capability to
      collect the scan results in a simple JSON format. It provides an
      inventory of your infrastructure components along with their
      associated scan data.

    features:
      - Inventory

